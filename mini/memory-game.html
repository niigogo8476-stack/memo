<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동물 메모리 게임</title>
<style>
  :root {
    --accent: #2b2a28;
    --accent-hover: #444340;
    --ink: #2b2a28;
    --muted: #7a7974;
    --bg: #faf9f5;
    --card: #ffffff;
    --soft: #ecebe6;
    --line: #e6e4dd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink);
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px;
  }
  h1 { font-size: 2rem; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 24px; }
  .bar { display: flex; gap: 12px; align-items: center; margin-bottom: 28px; flex-wrap: wrap; justify-content: center; }
  .stat { background: var(--soft); border-radius: 10px; padding: 10px 20px; font-size: .95rem; }
  .stat b { font-weight: 600; font-size: 1.1rem; margin-left: 6px; }
  button {
    background: var(--accent); color: #faf9f5; border: 0; border-radius: 10px;
    padding: 11px 24px; font-size: .95rem; font-weight: 500; cursor: pointer; font-family: inherit;
  }
  button:hover { background: var(--accent-hover); }

  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    width: min(440px, 100%);
  }
  .card { aspect-ratio: 1; perspective: 600px; cursor: pointer; border: 0; background: none; padding: 0; }
  .inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform .4s;
  }
  .card.open .inner, .card.matched .inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
    border-radius: 14px;
    border: 1px solid var(--line);
  }
  .back { background: var(--accent); color: #faf9f5; font-size: 1.6rem; }
  .front { background: var(--card); transform: rotateY(180deg); font-size: clamp(1.8rem, 9vw, 3rem); }
  .card.matched .front { background: var(--soft); }

  #msg { margin-top: 28px; min-height: 1.6em; font-size: 1.1rem; font-weight: 500; }
</style>
</head>
<body>

<h1>동물 메모리 게임</h1>

<div class="bar">
  <div class="stat">점수<b id="score">0</b></div>
  <div class="stat">시도<b id="tries">0</b></div>
  <div class="stat">라운드<b id="round">1</b></div>
  <button id="music" aria-pressed="true">🔊 배경음 켜짐</button>
  <button id="restart">다시 시작</button>
</div>

<div class="board" id="board"></div>
<p id="msg"></p>

<script>
  const POOL = ["🐶", "🐱", "🐰", "🦊", "🐼", "🐸", "🦁", "🐵", "🐯", "🐮", "🐷", "🐨", "🐔", "🐧", "🐙", "🦄", "🐢", "🦋", "🐳", "🦒"];
  const PAIRS = 8;
  const MATCH_POINTS = 10;
  const NEXT_ROUND_DELAY = 1500;

  let animals = [];   // 현재 라운드의 동물 8종
  let round = 0;

  const board = document.getElementById("board");
  const scoreEl = document.getElementById("score");
  const triesEl = document.getElementById("tries");
  const roundEl = document.getElementById("round");
  const msgEl = document.getElementById("msg");

  let score, tries, matchedPairs, opened, locked;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // 새 라운드: 점수는 유지, 이전 라운드와 겹치지 않는 동물로 교체
  function start(resetScore) {
    if (resetScore) { score = 0; tries = 0; round = 0; animals = []; }
    round++;
    const fresh = POOL.filter(e => !animals.includes(e));
    animals = shuffle(fresh).slice(0, PAIRS);
    matchedPairs = 0; opened = []; locked = false;
    scoreEl.textContent = score; triesEl.textContent = tries; roundEl.textContent = round;
    msgEl.textContent = "";
    board.innerHTML = "";
    shuffle([...animals, ...animals]).forEach(emoji => {
      const card = document.createElement("button");
      card.className = "card";
      card.dataset.emoji = emoji;
      card.setAttribute("aria-label", "카드");
      card.innerHTML =
        '<div class="inner"><div class="face back">?</div><div class="face front">' + emoji + '</div></div>';
      card.addEventListener("click", () => flip(card));
      board.appendChild(card);
    });
  }

  function flip(card) {
    if (locked || card.classList.contains("open") || card.classList.contains("matched")) return;
    card.classList.add("open");
    opened.push(card);
    if (opened.length < 2) return;

    locked = true;
    tries++;
    triesEl.textContent = tries;
    const [a, b] = opened;

    if (a.dataset.emoji === b.dataset.emoji) {
      a.classList.replace("open", "matched");
      b.classList.replace("open", "matched");
      score += MATCH_POINTS;
      scoreEl.textContent = score;
      matchedPairs++;
      opened = []; locked = false;
      if (matchedPairs === PAIRS) {
        locked = true;
        msgEl.textContent = "🎉 모두 맞혔어요! 새로운 동물이 나와요…";
        setTimeout(() => start(false), NEXT_ROUND_DELAY);
      }
    } else {
      setTimeout(() => {
        a.classList.remove("open");
        b.classList.remove("open");
        opened = []; locked = false;
      }, 800);
    }
  }

  // ── 배경음: 외부 파일 없이 Web Audio로 만든 잔잔한 반복 멜로디 ──
  const bgm = (() => {
    const MELODY = [523.25, 659.25, 783.99, 659.25, 587.33, 698.46, 880, 698.46,
                    523.25, 659.25, 783.99, 1046.5, 880, 783.99, 659.25, 587.33];
    const BASS = [130.81, 174.61, 146.83, 196];
    const BEAT = 0.32;
    let ctx, master, timer, nextTime = 0, step = 0, playing = false;

    function note(freq, t, dur, type, vol) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + dur + 0.05);
    }
    function schedule() {
      while (nextTime < ctx.currentTime + 0.4) {
        note(MELODY[step % 16], nextTime, BEAT * 1.8, "triangle", 0.5);
        if (step % 4 === 0) note(BASS[(step / 4) % 4], nextTime, BEAT * 3.6, "sine", 0.7);
        nextTime += BEAT; step++;
      }
    }
    return {
      get playing() { return playing; },
      start() {
        if (!ctx) {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
          master = ctx.createGain(); master.gain.value = 0.08; master.connect(ctx.destination);
        }
        ctx.resume();
        if (playing) return;
        playing = true; nextTime = ctx.currentTime + 0.05;
        schedule(); timer = setInterval(schedule, 100);
      },
      stop() { playing = false; clearInterval(timer); if (ctx) ctx.suspend(); }
    };
  })();

  const musicBtn = document.getElementById("music");
  let wantMusic = true;
  function renderMusicBtn() {
    musicBtn.textContent = wantMusic ? "🔊 배경음 켜짐" : "🔇 배경음 꺼짐";
    musicBtn.setAttribute("aria-pressed", wantMusic);
  }
  musicBtn.addEventListener("click", () => {
    wantMusic = !wantMusic;
    wantMusic ? bgm.start() : bgm.stop();
    renderMusicBtn();
  });
  // 브라우저 정책상 소리는 사용자 첫 조작 뒤에 시작할 수 있음
  document.addEventListener("pointerdown", e => {
    if (wantMusic && !e.target.closest("#music")) bgm.start();
  }, { once: true });

  document.getElementById("restart").addEventListener("click", () => start(true));
  start(true);
</script>
</body>
</html>
